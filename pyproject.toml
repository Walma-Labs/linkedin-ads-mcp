[project]
name = "linkedin-ads-mcp"
version = "0.1.0"
description = "LinkedIn Ads MCP server: campaigns, creatives, performance, period comparison and audience demographics from Campaign Manager for Claude, Cursor and any MCP client."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Walma AI", email = "info@walma.ai" }]
keywords = ["mcp", "model-context-protocol", "linkedin", "linkedin-ads", "campaign-manager", "claude", "marketing-api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/Walma-Labs/linkedin-ads-mcp"
Issues = "https://github.com/Walma-Labs/linkedin-ads-mcp/issues"

[project.scripts]
linkedin-ads-mcp = "linkedin_ads_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linkedin_ads_mcp*"]
